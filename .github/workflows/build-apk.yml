name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build SkyPulse Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Install Mobile Dependencies
        working-directory: ./mobile
        run: npm ci || npm install

      - name: Build Web Distribution and Sync Capacitor Android
        working-directory: ./mobile
        run: npm run android:sync

      - name: Make Gradlew Executable
        run: chmod +x mobile/android/gradlew

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Debug APK with Gradle
        working-directory: ./mobile/android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Find and Prepare Output APK
        run: |
          mkdir -p release-artifacts
          find mobile/android/app/build/outputs/apk -name "*.apk" -exec cp {} release-artifacts/SkyPulse-v1.0-debug.apk \;
          ls -la release-artifacts/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyPulse-Android-APK
          path: release-artifacts/SkyPulse-v1.0-debug.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: SkyPulse Android App v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          files: release-artifacts/SkyPulse-v1.0-debug.apk
          body: |
            ## 📱 SkyPulse Android App
            
            Download and install the APK directly on your Android phone!
            
            ### ⬇️ Direct Download APK:
            - **[Download SkyPulse-v1.0-debug.apk](https://github.com/Ankitkumar242/Weather-APP/releases/download/v1.0.0-${{ github.run_number }}/SkyPulse-v1.0-debug.apk)** (Click to download directly)
            
            *(Or scroll down to the **Assets** section below and tap `SkyPulse-v1.0-debug.apk`)*
            
            ### 📲 Phone Installation:
            1. Download the `.apk` file onto your phone.
            2. Tap the file in your notifications or Downloads folder.
            3. Tap **Install** (allow from unknown sources if prompted).
            4. Open the app to enjoy precision weather forecasts!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
