name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build SkyPulse Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Install Mobile Dependencies
        working-directory: ./mobile
        run: npm ci || npm install

      - name: Build Web Distribution and Sync Capacitor Android
        working-directory: ./mobile
        run: npm run android:sync

      - name: Make Gradlew Executable
        run: chmod +x mobile/android/gradlew

      - name: Build Debug APK with Gradle
        working-directory: ./mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK for Easy Download
        run: |
          mkdir -p release-artifacts
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/SkyPulse-v1.0-debug.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyPulse-Android-APK
          path: release-artifacts/SkyPulse-v1.0-debug.apk
          retention-days: 30

      - name: Create GitHub Release with APK (Optional)
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: SkyPulse Android App v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          files: release-artifacts/SkyPulse-v1.0-debug.apk
          body: |
            ## 📱 SkyPulse Android App
            
            Download and install the APK directly on your Android phone!
            
            ### ⬇️ Download
            - **[SkyPulse-v1.0-debug.apk](release-artifacts/SkyPulse-v1.0-debug.apk)**
            
            ### 📲 Installation Instructions:
            1. Download the `.apk` file onto your phone.
            2. Tap the file in your notifications or Downloads folder.
            3. Tap **Install** (if prompted, enable *Allow from this source*).
            4. Open the app and enjoy precision weather intelligence!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

